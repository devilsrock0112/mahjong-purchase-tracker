<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mahjong Purchase Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #efead9;
      --forest: #125a2d;
      --sage: #779164;
      --sage-dark: #5f7650;
      --terracotta: #784f24;
      --terracotta-dark: #5e3d1c;
      --ink: #33301f;
      --border: rgba(51, 48, 31, 0.16);
      --error: #a3352a;
      --sub: #6b6650;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Nunito Sans", system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      max-width: 680px;
      margin: 0 auto;
      padding-inline: 1.25rem;
      padding-block: 2.5rem;
    }
    h1 {
      font-family: "Roboto Slab", Georgia, serif;
      font-weight: 900;
      color: var(--forest);
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      letter-spacing: -0.01em;
      margin: 0 0 1.5rem;
    }
    h2 {
      font-family: "Roboto Slab", Georgia, serif;
      font-weight: 700;
      color: var(--forest);
      font-size: 1.2rem;
      margin: 0 0 0.75rem;
    }
    nav.tabs {
      display: inline-flex;
      gap: 2px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 1.5rem;
    }
    nav.tabs button {
      background: transparent;
      color: var(--forest);
      border: none;
      border-radius: 999px;
      padding: 0.5rem 1.1rem;
      font-family: "Roboto Slab", Georgia, serif;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    nav.tabs button.active {
      background: var(--terracotta);
      color: #fdfaf0;
    }
    nav.tabs button:hover:not(.active) { background: var(--cream); }
    .tab-panel[hidden] { display: none; }
    .original-price {
      text-decoration: line-through;
      color: var(--sub, #6b6650);
      margin-right: 0.4rem;
      font-size: 0.85em;
    }
    .sale-badge {
      display: inline-block;
      background: var(--sage);
      color: #fdfaf0;
      border-radius: 999px;
      padding: 0.1rem 0.6rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-left: 0.4rem;
    }
    table.finds a { color: var(--terracotta); }
    .remove-btn {
      background: none;
      border: none;
      color: var(--sub, #6b6650);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px 6px;
    }
    .remove-btn:hover { color: var(--error); }
    #finds-updated {
      color: var(--sub);
      font-size: 0.85rem;
      margin: -0.25rem 0 1rem;
    }
    .category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }
    .filter-btn {
      background: #fff;
      color: var(--forest);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      font-family: "Nunito Sans", sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--sage);
      color: #fdfaf0;
      border-color: var(--sage);
    }
    .filter-btn:hover:not(.active) { background: var(--cream); }
    form {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
    }
    input {
      padding: 0.5rem 0.6rem;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--cream);
      color: var(--ink);
    }
    input:focus-visible, button:focus-visible {
      outline: 2px solid var(--sage);
      outline-offset: 1px;
    }
    input[name="item"] { flex: 1; min-width: 150px; }
    button {
      background: var(--terracotta);
      color: #fdfaf0;
      border: none;
      border-radius: 6px;
      padding: 0.55rem 1.2rem;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--terracotta-dark); }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    th {
      text-align: left;
      padding: 0.6rem 0.7rem;
      background: var(--sage);
      color: #fdfaf0;
      font-family: "Roboto Slab", Georgia, serif;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    td {
      padding: 0.55rem 0.7rem;
      border-bottom: 1px solid var(--border);
    }
    tbody tr:last-child td { border-bottom: none; }
    tfoot td {
      font-weight: 700;
      color: var(--forest);
      border-top: 2px solid var(--sage);
      border-bottom: none;
    }
    #error {
      color: var(--error);
      background: rgba(163, 53, 42, 0.08);
      border-radius: 6px;
      padding: 0.5rem 0.7rem;
      margin: -1rem 0 1.5rem;
    }
  </style>
</head>
<body>
  <h1>Mahjong Purchase Tracker</h1>

  <nav class="tabs">
    <button type="button" class="tab-btn active" data-tab="purchases">Purchases</button>
    <button type="button" class="tab-btn" data-tab="finds">Supplies Search</button>
  </nav>

  <section id="tab-purchases" class="tab-panel">
    <form id="purchase-form">
      <input type="date" name="date" required>
      <input type="text" name="item" placeholder="Item" required>
      <input type="number" name="price" placeholder="Price" step="0.01" min="0.01" required>
      <button type="submit">Add</button>
    </form>
    <p id="error" hidden></p>
    <table>
      <thead>
        <tr><th>Date</th><th>Item</th><th>Price</th></tr>
      </thead>
      <tbody id="purchase-rows"></tbody>
      <tfoot>
        <tr><td colspan="2">Total</td><td id="total">$0.00</td></tr>
      </tfoot>
    </table>
  </section>

  <section id="tab-finds" class="tab-panel" hidden>
    <p id="finds-updated"></p>
    <div class="category-filters" id="category-filters">
      <button type="button" class="filter-btn active" data-category="all">All</button>
      <button type="button" class="filter-btn" data-category="set">Tile Sets</button>
      <button type="button" class="filter-btn" data-category="rack">Racks</button>
      <button type="button" class="filter-btn" data-category="clothing">Clothing</button>
      <button type="button" class="filter-btn" data-category="mat">Mats</button>
      <button type="button" class="filter-btn" data-category="card-case">Card Cases</button>
      <button type="button" class="filter-btn" data-category="other">Other</button>
    </div>
    <table class="finds">
      <thead>
        <tr><th>Name</th><th>Category</th><th>Price</th><th>Source</th><th>Found</th><th></th></tr>
      </thead>
      <tbody id="finds-rows"></tbody>
    </table>
  </section>

  <script src="app.js"></script>
</body>
</html>
